name: PlanBlindBox CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Java Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mod-server
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mod-server/pom.xml
      - name: Build and test
        run: mvn -B -ntp clean verify
      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: mod-server/target/surefire-reports/
          if-no-files-found: warn

  opaque:
    name: OPAQUE Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: opaque-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: opaque-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run OPAQUE smoke test
        run: npm run smoke

  frontend:
    name: Flutter Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Check shared test data and declared asset directories
        run: |
          test -f ../mod-spec/conformance/manifest-v1-vectors.json
          test -d assets/collectibles/butterfly || { echo 'Missing assets/collectibles/butterfly'; exit 1; }
          test -f assets/opaque/index.html || { echo 'Missing assets/opaque/index.html'; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Install SQLite native libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - name: Install dependencies
        run: flutter pub get
      - name: Run Flutter tests
        run: flutter test --reporter expanded
