server:
  port: ${MOD_SERVER_PORT:8091}
spring:
  application:
    name: planblindbox-mod-server
  datasource:
    url: ${MOD_DB_URL:jdbc:mysql://localhost:3306/plan_mod_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MOD_DB_USER:mod_app}
    password: ${MOD_DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  flyway:
    enabled: true
mod:
  admin-token: ${MOD_ADMIN_TOKEN:}
  allowed-origins: ${MOD_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  platform-signing:
    # Keep the platform proof key separate from every Publisher signing key.
    # Empty defaults preserve startup but proof issuance returns 503 (fail closed).
    private-key-pkcs8-base64: ${MOD_PLATFORM_SIGNING_PRIVATE_KEY_PKCS8_BASE64:}
    public-key-x509-base64: ${MOD_PLATFORM_SIGNING_PUBLIC_KEY_X509_BASE64:}
    # Preferred multi-key mode. Each entry has publicKeyX509Base64, status, and an
    # optional privateKeyPkcs8Base64 only for the single ACTIVE key.
    key-ring-json: ${MOD_PLATFORM_SIGNING_KEY_RING_JSON:}
    active-key-id: ${MOD_PLATFORM_SIGNING_ACTIVE_KEY_ID:}
    issuer: ${MOD_PLATFORM_SIGNING_ISSUER:planblindbox-mod-server}
    ttl-seconds: ${MOD_PLATFORM_SIGNING_TTL_SECONDS:300}
auth:
  jwt:
    secret-base64: ${APP_JWT_SECRET_BASE64:}
    issuer: planblindbox
    audience: planblindbox-api
    ttl-seconds: 7200
  reset:
    hmac-secret-base64: ${PASSWORD_RESET_HMAC_SECRET_BASE64:}
    mail-from: ${MAIL_FROM:}
  avatars:
    directory: ${APP_AVATAR_DIR:./data/avatars}

opaque:
  service:
    url: ${OPAQUE_SERVICE_URL:http://127.0.0.1:8092}
    internal-secret: ${OPAQUE_INTERNAL_SECRET:}
