server:
  port: ${MOD_SERVER_PORT:8091}
spring:
  application:
    name: planblindbox-mod-server
  datasource:
    url: ${MOD_DB_URL:jdbc:mysql://localhost:3306/plan_mod_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MOD_DB_USER:mod_app}
    password: ${MOD_DB_PASSWORD:}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  flyway:
    enabled: true
mod:
  admin-token: ${MOD_ADMIN_TOKEN:}
  allowed-origins: ${MOD_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
auth:
  jwt:
    secret-base64: ${APP_JWT_SECRET_BASE64:}
    issuer: planblindbox
    audience: planblindbox-api
    ttl-seconds: 7200
  reset:
    hmac-secret-base64: ${PASSWORD_RESET_HMAC_SECRET_BASE64:}
    mail-from: ${MAIL_FROM:}
  avatars:
    directory: ${APP_AVATAR_DIR:./data/avatars}
